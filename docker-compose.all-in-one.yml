# LLMGateway 单容器简化版 Docker Compose 配置
# 适用于资源有限的 NAS 环境
# 将所有服务合并到一个容器中，减少资源占用

services:
  llmgateway:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: llmgateway
    ports:
      - "${API_PORT:-8000}:8000"
      - "${GATEWAY_PORT:-8080}:8080"
      - "${FRONTEND_PORT:-80}:80"
      - "${REACT_FRONTEND_PORT:-88}:88"
    environment:
      - DB_TYPE=sqlite
      - DB_PATH=/data/llmgateway.db
      - ENCRYPT_KEY=${ENCRYPT_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SWITCH_THRESHOLD=${SWITCH_THRESHOLD:-99}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-10}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
